name: CNN Turk - alle 15 Minuten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '6,21,36,51 * * * *'

permissions:
  contents: read

concurrency:
  group: cnn-turk-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium installieren
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: CNN Turk unabhaengig pruefen und synchronisieren
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          WORKER_URL: https://cnn-turk-browser-test.54xsai54.workers.dev
        run: python scripts/cnn_refresh.py
